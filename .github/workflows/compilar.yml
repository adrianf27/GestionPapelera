name: Compilar GestionarPapelera

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    name: Compilar GestionarPapelera.exe
    runs-on: windows-latest

    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Instalar .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restaurar dependencias
        run: dotnet restore GestionarPapelera.csproj

      - name: Compilar EXE autocontenido
        run: |
          dotnet publish GestionarPapelera.csproj `
            -c Release `
            -r win-x64 `
            --self-contained true `
            -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:DebugType=None `
            -p:DebugSymbols=false `
            -o publish

      - name: Comprobar que existe el EXE
        shell: pwsh
        run: |
          $exe = "publish\GestionarPapelera.exe"

          if (-not (Test-Path $exe)) {
              Write-Error "No se ha generado GestionarPapelera.exe"
              exit 1
          }

          Write-Host "EXE generado correctamente:"
          Get-Item $exe | Select-Object Name, Length, FullName

      - name: Crear artefacto
        uses: actions/upload-artifact@v4
        with:
          name: GestionarPapelera-win-x64
          path: publish/GestionarPapelera.exe
          if-no-files-found: error
